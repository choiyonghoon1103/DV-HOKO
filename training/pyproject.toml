[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dv-hoko-training"
version = "0.1.0"
description = "Source-only training pipeline for the DV-HOKO release"
requires-python = ">=3.10"
dependencies = [
  "dvhoko",
  "numpy>=1.26,<2",
  "scipy>=1.11,<2",
  "torch>=2.4,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".."]
